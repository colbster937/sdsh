on:
  push:
    paths:
      - 'src/**'
      - 'pom.xml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn -B -DskipTests install
      - id: vars
        run: echo "afct=$(mvn -Dexpression=project.build.finalName -B -q -DforceStdout help:evaluate)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ./target/${{ steps.vars.outputs.afct }}.jar
          name: ${{ steps.vars.outputs.afct }}
          if-no-files-found: error